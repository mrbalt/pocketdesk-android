name: Build APK

# Builds the Android app on GitHub's servers. Run it from the "Actions" tab (Run workflow)
# or just push; then download "PocketDesk-apk" from the finished run.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PocketDesk-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
